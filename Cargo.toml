[workspace]
resolver = "3"
members = ["compilers/*"]
default-members = [
    "compilers/*",
]
exclude = [
    "compilers/.DS_Store",
]


[workspace.package]
edition = "2024"
version = "0.0.0"
authors = []
license = "AGPL-3.0-only"


[workspace.dependencies]
clap = { version = "*", features = ["derive"] }
flate2 = "1.0"
indexmap = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
walkdir = "2.0"
rpg-data = { path = "compilers/rpg-data", version = "0.0.0" }
rpg-types = { path = "compilers/rpg-types", version = "0.0.0" }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
rpg-config = { path = "compilers/rpg-config", version = "0.0.0" }
rpg-translator = { path = "compilers/rpg-translator", version = "0.0.0" }
rpg-parser = { path = "compilers/rpg-parser", version = "0.0.0" }
base64 = "0.21"
thiserror = "2.0"
rand = "0.8"
bevy = { version = "0.14", features = ["default"] }
image = "0.24"
bytemuck = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

[profile.release]
lto = true
panic = "abort"
